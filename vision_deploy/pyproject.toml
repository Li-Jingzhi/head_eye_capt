[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stereo-robot-vision"
version = "2.2.0"
description = "Portable calibrated stereo pixels to robot arm coordinates"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "opencv-python>=4.5"]

[project.scripts]
stereo-robot = "stereo_robot.__main__:main"

[tool.setuptools.package-data]
stereo_robot = ["calibration/*.json", "calibration/*.ini", "docs/*.md"]

[tool.setuptools.packages.find]
include = ["stereo_robot*"]
